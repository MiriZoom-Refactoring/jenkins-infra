services:
  jenkins:
    build:
      context: .
    container_name: mirizoom-jenkins
    restart: unless-stopped

    # Controller에서 빌드와 Ansible을 실행하는 3대 실습 구성입니다.
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Duser.timezone=Asia/Seoul
        -Xms128m -Xmx512m -XX:MaxMetaspaceSize=256m

      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}

      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}

      MIRIZOOM_KAKAO_JS_KEY: ${MIRIZOOM_KAKAO_JS_KEY:-}

      BACKEND_REPOSITORY_URL: ${BACKEND_REPOSITORY_URL}
      FRONTEND_REPOSITORY_URL: ${FRONTEND_REPOSITORY_URL:-https://github.com/KB-IT-s-your-life-PJT-23-4/frontend.git}
      FASTAPI_REPOSITORY_URL: ${FASTAPI_REPOSITORY_URL:-https://github.com/KB-IT-s-your-life-PJT-23-4/FastApi.git}
      DEPLOY_REPOSITORY_URL: ${DEPLOY_REPOSITORY_URL}
      MIRIZOOM_EC2_SSH_USER: ${MIRIZOOM_EC2_SSH_USER:-ec2-user}
      MIRIZOOM_WEB_HOST: ${MIRIZOOM_WEB_HOST:?MIRIZOOM_WEB_HOST is required}
      MIRIZOOM_APP_HOST: ${MIRIZOOM_APP_HOST:?MIRIZOOM_APP_HOST is required}
      ENABLE_BATCH_SCHEDULE: ${ENABLE_BATCH_SCHEDULE:-false}

    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc_configs:ro
      - ./jobs:/var/jenkins_home/jobdsl:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./known_hosts:/var/jenkins_home/.ssh/known_hosts:ro
    secrets:
      - ec2_ssh_key

volumes:
  jenkins_home:

secrets:
  ec2_ssh_key:
    file: ./secrets/ec2_ssh_key
